media:
  input: src/assets/portfolio
  output: ../../assets/portfolio
content:
  - name: portfolio
    label: Portfolio Pieces
    path: src/content/portfolio
    filename: "{fields.title}.md"
    type: collection
    fields:
      - name: title
        label: Title
        type: string
      - name: intro
        label: Intro
        type: string
      - name: description
        label: Description
        type: string
      - name: image
        label: Image
        type: image # This MUST be 'image'
        config:
          multiple: false
      - name: publishDate
        label: Publish Date
        type: date
      - name: url
        label: Project URL
        type: string
        description: Link to the live site, e.g. https://example.com (optional)
        pattern:
          regex: "^(https?://\\S+)?$"
          message: "Use a full URL starting with https://"
      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown
